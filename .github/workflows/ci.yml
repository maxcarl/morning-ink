name: CI

on:
  push:
    branches: [main]
    # A release: tag v1.2.3 on main; the image gets the tags 1.2.3, 1.2 and 1.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/morning-ink

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet format --verify-no-changes --no-restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release
      - run: .github/workflows/kept-images.test.sh

  image:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      # Pull requests only build the image (both architectures) to prove the Dockerfile works.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # No provenance attestation: it adds extra untagged versions to GHCR for no use here.
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Keeps "latest" and the newest three releases (by their x.y.z tag, with their x.y and x tags); everything else
      # goes. A multi-arch image is an index whose per-platform manifests are untagged versions of their own,
      # so the platform manifests of every kept index are kept too.
      - name: Remove old image versions
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSIONS: /users/${{ github.repository_owner }}/packages/container/morning-ink/versions
          KEEP_RELEASES: 3
        run: |
          set -euo pipefail
          versions=$(gh api --paginate "$VERSIONS" | jq -s 'add')
          kept=$(jq -r --argjson keep "$KEEP_RELEASES" -f .github/workflows/kept-images.jq <<<"$versions")
          if [ -z "$kept" ]; then echo "No image to keep found, refusing to delete anything."; exit 1; fi
          keep=$(for digest in $kept; do
            echo "$digest"
            docker buildx imagetools inspect --raw "$IMAGE@$digest" | jq -r '.manifests[]?.digest'
          done)
          jq -r --arg keep "$keep" '($keep | split("\n")) as $k | .[] | select(.name as $n | $k | index($n) | not) | .id' <<<"$versions" \
            | while read -r id; do gh api --method DELETE "$VERSIONS/$id" --silent; done
