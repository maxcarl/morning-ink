name: Pages

# Publishes the landing page in page/. Its images and favicon are symlinks to docs/images and the app's favicon;
# upload-pages-artifact dereferences them, so the site gets real files without copies in the repository.
on:
  push:
    branches: [main]
    paths:
      - page/**
      - docs/images/**
      - src/MorningInk.Web/wwwroot/favicon.svg
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Job permissions replace the workflow's, so checkout needs contents: read here again.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: page
      - id: deployment
        uses: actions/deploy-pages@v4
