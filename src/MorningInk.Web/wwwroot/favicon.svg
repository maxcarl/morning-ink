  <text x="32" y="43" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="700" fill="#f5f0e8">M</text>
  <rect x="12" y="50" width="40" height="2" fill="#f5f0e8"/>
  <rect x="12" y="54" width="40" height="2" fill="#f5f0e8"/>
</svg>
